<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blockly Sample App</title>
  
  <!-- 1. Include core library extensions and our custom block rules safely -->
  <script src="custom_blocks.js"></script>
  <script defer src="bundle.js"></script>
</head>
<body>

  <div id="pageContainer">
    <div id="outputPane">
      <pre id="generatedCode"><code></code></pre>
      <div id="output"></div>
    </div>
    
    <!-- The main layout area -->
    <div id="blocklyDiv"></div>
  </div>

  <!-- 2. The Native Injector: This overrides or appends to the toolbox layout structure -->
  <xml id="toolbox" style="display: none">
    <category name="Custom Blocks" colour="120">
      <block type="my_simple_block"></block>
    </category>
  </xml>

</body>
</html>
