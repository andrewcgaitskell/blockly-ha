<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Custom Blockly Workspace</title>
  
  <!-- 1. Load official, production-ready Blockly libraries from CDN -->
  <script src="https://unpkg.com/blockly@13.3.0/blockly.min.js"></script>

  <!-- 2. JavaScript Generator Plugin (Converts blocks to code strings) -->
  <script src="https://unpkg.com/blockly@13.3.0/blockly_compressed.js"></script>
  
  <!-- 3. Load your custom blocks file -->
  <script src="custom_blocks.js"></script>

  <style>
    body { margin: 0; max-width: 100vw; font-family: sans-serif; }
    #pageContainer { display: flex; width: 100%; height: 100vh; }
    #blocklyDiv { flex-basis: 100%; height: 100%; }
    #outputPane { display: flex; flex-direction: column; width: 400px; flex: 0 0 400px; margin: 1rem; overflow: auto; }
    #generatedCode { height: 50%; background-color: #f7f0e4; padding: 10px; overflow: auto; }
    #output { height: 50%; border-top: 1px solid #ccc; padding-top: 10px; }
  </style>
</head>
<body>

  <div id="pageContainer">
    <div id="outputPane">
      <pre id="generatedCode"><code id="codeArea"></code></pre>
      <div id="output"></div>
    </div>
    <div id="blocklyDiv"></div>
  </div>

  <script>
    // 3. Define your Toolbox layout in standard JSON format
    const toolboxJson = {
      "kind": "categoryToolbox",
      "contents": [
        {
          "kind": "category",
          "name": "Standard Logic",
          "colour": "%{BKY_LOGIC_HUE}",
          "contents": [
            { "kind": "block", "type": "controls_if" },
            { "kind": "block", "type": "logic_compare" }
          ]
        },
        {
          "kind": "category",
          "name": "My Custom Blocks",
          "colour": "120",
          "contents": [
            { "kind": "block", "type": "my_simple_block" }
          ]
        }
      ]
    };

    // 4. Initialize the clean workspace
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: toolboxJson
    });

    // 5. Automatically update the code panel whenever blocks change
    workspace.addChangeListener(() => {
      const code = Blockly.JavaScript.workspaceToCode(workspace);
      document.getElementById('codeArea').innerText = code;
    });
  </script>

</body>
</html>
